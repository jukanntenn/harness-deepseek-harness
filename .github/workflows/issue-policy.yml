name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Resolve deployment flavor and credentials
        # The accountType in the checked-out config decides which credential
        # flavor must exist; the later `||` selections are proven by this step,
        # not silent defaults. A config absent from the default branch skips
        # only for the pull request that introduces it (the first-adoption
        # bootstrap): there is no policy to validate against until that pull
        # request merges, and every other absence fails loud as drift.
        id: flavor
        if: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' }}
        env:
          APP_CLIENT_ID: ${{ vars.HDSH_ISSUE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HDSH_ISSUE_APP_PRIVATE_KEY }}
          PROJECT_PAT: ${{ secrets.HDSH_PROJECT_PAT }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -eu
          if [ ! -f .github/issue-management/config.json ]; then
            if [ -n "$PR_NUMBER" ] && gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | grep -Fxq '.github/issue-management/config.json'; then
              echo "::notice title=Issue policy bootstrap::no policy config on the default branch yet; this pull request introduces it, so validation starts after merge"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Issue policy config::.github/issue-management/config.json is absent from the default branch checkout" >&2
            exit 1
          fi
          flavor=$(jq -r .accountType .github/issue-management/config.json)
          case "$flavor" in
            organization)
              if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
                echo "::error title=Issue policy credentials::organization flavor requires vars.HDSH_ISSUE_APP_CLIENT_ID and secrets.HDSH_ISSUE_APP_PRIVATE_KEY"
                exit 1
              fi
              ;;
            user)
              if [ -z "$PROJECT_PAT" ]; then
                echo "::error title=Issue policy credentials::user flavor requires secrets.HDSH_PROJECT_PAT (classic PAT, project scope)"
                exit 1
              fi
              ;;
            *)
              echo "::error title=Issue policy config::unknown accountType '$flavor' in .github/issue-management/config.json"
              exit 1
              ;;
          esac
          echo "account-type=$flavor" >> "$GITHUB_OUTPUT"
      - name: Create Project read token
        id: app-token
        if: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' && steps.flavor.outputs.skip != 'true' && steps.flavor.outputs.account-type == 'organization' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.2
        with:
          client-id: ${{ vars.HDSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HDSH_ISSUE_APP_PRIVATE_KEY }}
          owner: jukanntenn
          repositories: harness-deepseek-harness
          permission-issues: read
          permission-organization-projects: read
      - name: Validate pull request
        if: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' && steps.flavor.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ steps.app-token.outputs.token || secrets.HDSH_PROJECT_PAT }}
        run: |
          uv sync --frozen
          uv run --no-sync hdsh policy pr --config .github/issue-management/config.json
