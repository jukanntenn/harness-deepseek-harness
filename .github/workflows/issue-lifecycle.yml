name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    # Runs on every pull_request_review event so the check reports success rather
    # than a gray "skipped" segment. The flavor, token-creating, and board-mutating
    # steps are gated at step level (a skipped step does not gray the job): only a
    # changes_requested review drives the Project board; approved/commented
    # reviews never mint a write-capable token.
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Resolve deployment flavor and credentials
        # The accountType in the checked-out config decides which credential
        # flavor must exist; the later `||` selections are proven by this step,
        # not silent defaults. Organization deployments authenticate REST and
        # GraphQL with one GitHub App token; user deployments cannot grant an
        # App access to user-owned Projects, so REST runs on github.token and
        # GraphQL on a classic PAT (project scope) from HDSH_PROJECT_PAT. A
        # default branch without a usable policy config — the config absent,
        # unparseable as JSON, or carrying no valid accountType — skips only
        # for the pull request that introduces or replaces it (the
        # first-adoption bootstrap); every other unusable config fails loud
        # as drift.
        id: flavor
        if: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested' }}
        env:
          APP_CLIENT_ID: ${{ vars.HDSH_ISSUE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HDSH_ISSUE_APP_PRIVATE_KEY }}
          PROJECT_PAT: ${{ secrets.HDSH_PROJECT_PAT }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -eu
          config=.github/issue-management/config.json
          state=""
          flavor=""
          if [ ! -f "$config" ]; then
            state="absent"
          elif flavor=$(jq -re '.accountType | select(. == "organization" or . == "user")' "$config" 2>/dev/null); then
            :
          else
            state="foreign"
          fi
          if [ -n "$state" ]; then
            if [ "$state" = "absent" ]; then
              notice="no policy config on the default branch yet; this pull request introduces it, so lifecycle transitions start after merge"
              drift="$config is absent from the default branch checkout"
            else
              notice="the default-branch config is not an hdsh policy, so there is no policy to apply; this pull request replaces it, so lifecycle transitions start after merge"
              drift="$config on the default branch is not an hdsh policy config"
            fi
            if [ -n "$PR_NUMBER" ] && gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | grep -Fxq "$config"; then
              echo "::notice title=Issue lifecycle bootstrap::$notice"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Issue lifecycle config::$drift" >&2
            exit 1
          fi
          case "$flavor" in
            organization)
              if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
                echo "::error title=Issue lifecycle credentials::organization flavor requires vars.HDSH_ISSUE_APP_CLIENT_ID and secrets.HDSH_ISSUE_APP_PRIVATE_KEY"
                exit 1
              fi
              ;;
            user)
              if [ -z "$PROJECT_PAT" ]; then
                echo "::error title=Issue lifecycle credentials::user flavor requires secrets.HDSH_PROJECT_PAT (classic PAT, project scope)"
                exit 1
              fi
              ;;
          esac
          echo "account-type=$flavor" >> "$GITHUB_OUTPUT"
      - name: Create project token
        id: app-token
        if: ${{ (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') && steps.flavor.outputs.skip != 'true' && steps.flavor.outputs.account-type == 'organization' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.2
        with:
          client-id: ${{ vars.HDSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HDSH_ISSUE_APP_PRIVATE_KEY }}
          owner: jukanntenn
          repositories: harness-deepseek-harness
      - name: Handle repository event
        if: ${{ (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') && steps.flavor.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PROJECT_TOKEN: ${{ steps.app-token.outputs.token || secrets.HDSH_PROJECT_PAT }}
        run: |
          uv sync --frozen
          uv run --no-sync hdsh policy lifecycle --config .github/issue-management/config.json
