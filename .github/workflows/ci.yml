name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync
      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .

  coverage:
    name: Tests with 100% coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync
      - name: Run pytest with the coverage gate
        run: uv run --no-sync pytest

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync
      - name: basedpyright
        run: uv run --no-sync basedpyright
      - name: ty
        run: uv run --no-sync ty check src

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync
      - name: Bilingual pairing corpus check
        run: uv run --no-sync hdsh pairing verify
      - name: Decision-record format gate
        run: uv run --no-sync hdsh rfc verify

  hook-config:
    name: Hook manifest validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true
      - name: Validate prek.toml
        run: prek validate-config prek.toml
      - name: Validate the published hook manifest
        run: prek validate-manifest .pre-commit-hooks.yaml
